name: Android → Google Play

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Yayın kanalı'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - internal
          - beta
      bump:
        description: 'Versiyon artır (yalnızca manuel tetikte; tag push zaten bump içerir)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
      notes:
        description: 'Sürüm notları (boşsa son commitlerden üretilir)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Version bump (yalnızca manuel tetik)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bump != 'none'
        run: |
          git config user.name "esnaftaucuz-ci"
          git config user.email "ci@esnaftaucuz.local"
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          V=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore: sürüm $V (Play yayını)" || echo "commit yok"
          git push origin HEAD:main

      - name: Env dosyası
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://xmskjcdwmwlcmjexnnxw.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: {{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_aJ6U77lzPTrGZEjQ6WJgUw_PPusa7R-' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY
          VITE_GOOGLE_MAPS_API_KEY=$VITE_GOOGLE_MAPS_API_KEY
          EOF

      - name: Web build
        run: |
          npm ci
          npm run build

      - name: Capacitor Android hazırlığı
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          npx cap add android
          if [ -n "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          else
            echo "⚠️ FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64 yok — push bildirimleri kapalı olacak"
          fi
          npx cap sync android
          node scripts/configure-android-oauth.js

      - name: Release imzalama konfigürasyonu
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: node scripts/configure-android-release.mjs

      - name: AAB üret
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon
          ls -la app/build/outputs/bundle/release/

      - name: Sürüm notları
        id: notes
        env:
          MANUAL_NOTES: ${{ github.event.inputs.notes }}
        run: |
          if [ -n "$MANUAL_NOTES" ]; then
            NOTES="$MANUAL_NOTES"
          else
            NOTES=$(git log --pretty=format:'- %s' "$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)"..HEAD | head -20)
          fi
          if [ -z "$NOTES" ]; then NOTES="Otomatik sürüm"; fi
          mkdir -p whatsnew
          printf '%s\n' "$NOTES" > whatsnew/whatsnew-tr-TR
          printf '%s\n' "$NOTES" > whatsnew/whatsnew-en-US
          echo "Notlar:" && cat whatsnew/whatsnew-tr-TR

      - name: Google Play'e yükle
        if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.esnaftaucuz.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.track || 'production' }}
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: whatsnew
          changesNotSentForReview: false

      - name: Play yükleme atlandı (secret yok)
        if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON == '' }}
        run: |
          echo "⚠️ PLAY_SERVICE_ACCOUNT_JSON secret'ı yok — otomatik Play yüklemesi atlandı."
          echo "👉 AAB'yi Actions → bu iş → Artifacts bölümünden indirip"
          echo "   Windows'ta publish-play-internal.ps1 ile elle yükleyebilirsin."

      - name: AAB artifact (yedek)
        uses: actions/upload-artifact@v4
        with:
          name: esnaftaucuz-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
