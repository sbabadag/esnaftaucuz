    <meta name="theme-color" content="#16a34a" />

    <meta name="google-site-verification" content="BURAYA_TOKEN" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="esnaftaucuz" />
    <meta property="og:title" content="esnaftaucuz — Esnaf Fiyat Paylaşım Uygulaması" />

    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary" />
    <title>esnaftaucuz — Esnaf Fiyat Paylaşım Uygulaması</title>
    <!-- Restore path encoded by public/404.html SPA redirect (?/app/explore → /app/explore) -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
